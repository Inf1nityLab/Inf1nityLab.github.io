<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Разрешаем масштабирование страницы (pinch на телефоне, Ctrl+/- на ПК) —
       чтобы пользователь мог увеличивать сайт, включая видео уроков. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="Okurmen - Learning Center">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Okurmen">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Okurmen</title>
  <link rel="manifest" href="manifest.json">
  <!-- Firebase подключает само приложение (firebase_options.dart) — отдельный
       SDK на странице не нужен. -->
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
